name: ARM64 Appliance

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: arm64-appliance-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    BUN_VERSION: 1.4.4
    RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    changes:
        uses: ./.github/workflows/detect-changes.yml

    native-arm64:
        name: Native ARM64 appliance
        needs: changes
        if: ${{ !cancelled() }}
        env:
            RUN_CHECK: ${{ needs.changes.outputs.runtime != 'false' }}
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 75
        steps:
            - name: Require successful change detection
              env:
                  CHANGE_RESULT: ${{ needs.changes.result }}
              run: test "$CHANGE_RESULT" = success

            - name: Report unaffected check
              if: env.RUN_CHECK != 'true'
              run: echo 'No relevant inputs changed; this check does not need to run.'

            - name: Check out exact tested commit
              if: env.RUN_CHECK == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}

            - name: Require native Linux ARM64 execution
              if: env.RUN_CHECK == 'true'
              run: |
                  test "$(uname -s)/$(uname -m)" = Linux/aarch64
                  test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/arm64

            - name: Set up Bun
              if: env.RUN_CHECK == 'true'
              id: bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Build and bind native appliance and HTTP3 client
              if: env.RUN_CHECK == 'true'
              id: images
              uses: ./.github/actions/runtime-images
              with:
                  platform: linux/arm64

            - name: Gate ARM64 image dependencies
              if: env.RUN_CHECK == 'true'
              env:
                  AUTOMATION_DIRECTORY: .
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/runtime-appliance/image.tar
                  IMAGE_ARCHITECTURE: arm64
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-image-report
                  REVISION: ${{ github.sha }}
              run: bash .github/scripts/security/scan-image.sh

            - name: Store exact ARM64 dependency assessment
              if: ${{ env.RUN_CHECK == 'true' && (always()) }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: arm64-advisory-evidence-${{ github.run_attempt }}
                  if-no-files-found: error
                  retention-days: 30
                  path: |
                      ${{ runner.temp }}/dependency-image-report/*.json
                      ${{ runner.temp }}/dependency-image-report/*.txt
                      ${{ runner.temp }}/dependency-image-report/*.sha256
                      ${{ runner.temp }}/dependency-image-report/controller/*.json
                      ${{ runner.temp }}/dependency-image-report/controller/*.txt
                      ${{ runner.temp }}/dependency-image-report/controller/*.sha256

            - name: Install locked smoke dependencies
              if: env.RUN_CHECK == 'true'
              run: bun install --frozen-lockfile

            - name: Native appliance TLS, HTTP3, ownership, backup and recovery
              if: env.RUN_CHECK == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts production

            - name: Prepare bounded background failure report
              if: env.RUN_CHECK == 'true'
              run: 'printf ''%s\n'' ''{"summary":{"passed":false,"capacity":"insufficient"},"failure":"runner-not-completed"}'' > "$RUNNER_TEMP/background-workers.json"'

            - name: Native request draining and clean shutdown
              if: env.RUN_CHECK == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/appliance-drain-smoke.ts

            - name: Native bounded background worker correctness scenarios
              if: env.RUN_CHECK == 'true'
              run: 'bun --no-env-file --no-orphans scripts/runtime-scale/background-run.ts --policies 100 --duration-seconds 120 --image "rentnerproxy-smoke-${RENTNERPROXY_SMOKE_RUN}:appliance" --report "$RUNNER_TEMP/background-workers.json"'

            - name: Store bounded ARM64 background report
              if: ${{ env.RUN_CHECK == 'true' && always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: arm64-background-workers-report-${{ github.run_attempt }}
                  path: '${{ runner.temp }}/background-workers.json'
                  if-no-files-found: error
                  retention-days: 14

            - name: Clean up this run and summarize
              if: ${{ env.RUN_CHECK == 'true' && (always() && steps.bun.outcome == 'success') }}
              run: bun --no-env-file .github/scripts/ci/production-smoke-ci.ts cleanup
