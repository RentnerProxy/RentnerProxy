name: Production Smokes
'on':
    pull_request: null

    push:
        branches:
            - main
    workflow_dispatch: null
permissions:
    contents: read
concurrency:
    group: 'production-smokes-${{ github.event.pull_request.number || github.ref }}'
    cancel-in-progress: true
env:
    RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
    BUN_VERSION: 1.4.4
    DOCKER_BUILD_SUMMARY: 'false'
    DOCKER_BUILD_RECORD_UPLOAD: 'false'
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
    changes:
        uses: ./.github/workflows/detect-changes.yml

    build-runtime-images:
        needs: changes
        if: ${{ needs.changes.outputs.runtime == 'true' }}
        name: Build shared runtime images
        runs-on: ubuntu-latest
        timeout-minutes: 60
        outputs:
            scope: ${{ steps.images.outputs.scope }}
            appliance_archive_sha256: ${{ steps.images.outputs.appliance_archive_sha256 }}
            appliance_identity_sha256: ${{ steps.images.outputs.appliance_identity_sha256 }}
            http3_archive_sha256: ${{ steps.images.outputs.http3_archive_sha256 }}
            http3_identity_sha256: ${{ steps.images.outputs.http3_identity_sha256 }}
            proxy_archive_sha256: ${{ steps.images.outputs.proxy_archive_sha256 }}
            proxy_identity_sha256: ${{ steps.images.outputs.proxy_identity_sha256 }}
        steps:
            - name: Check out exact target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Build and store exact runtime images
              id: images
              uses: ./.github/actions/runtime-images
              with:
                  include_proxy_runtime: 'true'

    production-smokes:
        name: Production Smokes
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Require successful selection and selected runtime image producer
              env:
                  SELECTION_RESULT: ${{ needs.changes.result }}
                  RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
                  IMAGE_BUILD_RESULT: ${{ needs.build-runtime-images.result }}
              run: |
                  test "$SELECTION_RESULT" = success
                  case "$RUNTIME_SELECTED" in
                    true) test "$IMAGE_BUILD_RESULT" = success ;;
                    false) echo 'Runtime inputs unchanged; no runtime execution required.' ;;
                    *) exit 1 ;;
                  esac
            - name: Check out repository
              if: needs.changes.outputs.runtime == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Bun
              if: needs.changes.outputs.runtime == 'true'
              id: bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies
              if: needs.changes.outputs.runtime == 'true'
              run: bun install --frozen-lockfile
            - name: Root-owned backup boundaries and off-host recovery
              if: needs.changes.outputs.runtime == 'true'
              run: |
                  mkdir -p tmp
                  sudo "$(command -v bun)" --no-env-file test --isolate \
                  ./web/src/tests/tooling/docker/production/backup-download.test.ts \
                  ./web/src/tests/tooling/docker/production/off-host.test.ts \
                  ./web/src/tests/tooling/docker/web/bootstrap-secrets.test.ts \
                  ./web/src/tests/tooling/scripts/backup/offhost/envelope.test.ts \
                  ./web/src/tests/tooling/recover-offhost-backup.test.ts
            - name: Docker discovery socket proxy restrictions
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans scripts/smoke/docker-discovery.ts
            - name: Verify and load same-run runtime images
              if: needs.changes.outputs.runtime == 'true'
              uses: ./.github/actions/load-runtime-images
              with:
                  include_proxy_runtime: 'true'
                  proxy_archive_sha256: ${{ needs.build-runtime-images.outputs.proxy_archive_sha256 }}
                  proxy_identity_sha256: ${{ needs.build-runtime-images.outputs.proxy_identity_sha256 }}
                  scope: ${{ needs.build-runtime-images.outputs.scope }}
                  appliance_archive_sha256: ${{ needs.build-runtime-images.outputs.appliance_archive_sha256 }}
                  appliance_identity_sha256: ${{ needs.build-runtime-images.outputs.appliance_identity_sha256 }}
                  http3_archive_sha256: ${{ needs.build-runtime-images.outputs.http3_archive_sha256 }}
                  http3_identity_sha256: ${{ needs.build-runtime-images.outputs.http3_identity_sha256 }}
            - name: Verify images for this run
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts verify-images
            - name: Proxy runtime
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts proxy
            - name: 'Production appliance, backup and restore'
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts production
            - name: 'Managed backups, secure downloads and recovery'
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts backups
            - name: Production appliance request draining
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/appliance-drain-smoke.ts
            - name: Certificates and ACME
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts certificates
            - name: Upstream TLS
              if: needs.changes.outputs.runtime == 'true'
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts upstream-tls
            - name: Clean up this run and summarize
              if: "always() && steps.bun.outcome == 'success'"
              run: bun --no-env-file .github/scripts/ci/production-smoke-ci.ts cleanup
        needs: [changes, build-runtime-images]
        if: ${{ !cancelled() }}
        env:
            RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
            RENTNERPROXY_SMOKE_RUN: ${{ needs.build-runtime-images.outputs.scope }}

    production-candidate:
        name: Production image dependency audit
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Require successful selection and selected runtime image producer
              env:
                  SELECTION_RESULT: ${{ needs.changes.result }}
                  RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
                  IMAGE_BUILD_RESULT: ${{ needs.build-runtime-images.result }}
              run: |
                  test "$SELECTION_RESULT" = success
                  case "$RUNTIME_SELECTED" in
                    true) test "$IMAGE_BUILD_RESULT" = success ;;
                    false) echo 'Runtime inputs unchanged; no runtime execution required.' ;;
                    *) exit 1 ;;
                  esac
            - name: Check out trusted audit automation
              if: needs.changes.outputs.runtime == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
            - name: Check out exact audited source
              if: needs.changes.outputs.runtime == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: source
                  ref: ${{ github.sha }}
            - name: Set up Bun
              if: needs.changes.outputs.runtime == 'true'
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Download exact production OCI artifact
              if: needs.changes.outputs.runtime == 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: 'runtime-appliance-${{ needs.build-runtime-images.outputs.scope }}'
                  path: '${{ runner.temp }}/runtime-appliance'
            - name: Install image inspection tools
              if: needs.changes.outputs.runtime == 'true'
              run: bash automation/.github/scripts/security/install-dependency-tools.sh
            - name: Verify exact producer artifact before trusted audit
              if: needs.changes.outputs.runtime == 'true'
              shell: bash
              env:
                  EXPECTED_ARCHIVE_SHA256: ${{ needs.build-runtime-images.outputs.appliance_archive_sha256 }}
                  EXPECTED_IDENTITY_SHA256: ${{ needs.build-runtime-images.outputs.appliance_identity_sha256 }}
                  IMAGE_SCOPE: ${{ needs.build-runtime-images.outputs.scope }}
                  REVISION: ${{ github.sha }}
              run: |
                  [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ && "$EXPECTED_IDENTITY_SHA256" =~ ^[a-f0-9]{64}$ ]]
                  printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$RUNNER_TEMP/runtime-appliance/image.tar" "$EXPECTED_IDENTITY_SHA256" "$RUNNER_TEMP/runtime-appliance/identity.json" | sha256sum --check --strict
                  test "$(git -C source rev-parse HEAD)" = "$REVISION"
                  jq -e --arg revision "$REVISION" --arg scope "$IMAGE_SCOPE" '
                    .schemaVersion == 1 and .revision == $revision and .scope == $scope and
                    .kind == "appliance" and .platform == "linux/amd64"
                  ' "$RUNNER_TEMP/runtime-appliance/identity.json" > /dev/null
                  skopeo inspect --override-os linux --override-arch amd64 "oci-archive:$RUNNER_TEMP/runtime-appliance/image.tar" |
                    jq -e --arg revision "$REVISION" --arg scope "$IMAGE_SCOPE" --slurpfile identity "$RUNNER_TEMP/runtime-appliance/identity.json" '
                      .Os == "linux" and .Architecture == "amd64" and .Digest == $identity[0].manifestDigest and
                      .Labels["org.opencontainers.image.revision"] == $revision and
                      .Labels["io.rentnerproxy.smoke-source"] == $revision and
                      .Labels["io.rentnerproxy.smoke-run"] == $scope and
                      .Labels["io.rentnerproxy.smoke-image"] == "appliance"' > /dev/null
            - name: Gate own image dependencies
              if: needs.changes.outputs.runtime == 'true'
              env:
                  AUTOMATION_DIRECTORY: automation
                  IMAGE_SOURCE: 'oci-archive:${{ runner.temp }}/runtime-appliance/image.tar'
                  REPORT_DIRECTORY: '${{ runner.temp }}/dependency-image-report'
              run: 'REVISION="$(git -C source rev-parse HEAD)" bash automation/.github/scripts/security/scan-image.sh'
            - name: Store exact-candidate assessment
              if: "always() && needs.changes.outputs.runtime == 'true'"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: production-advisory-evidence-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/dependency-image-report/manifest.json
                      ${{ runner.temp }}/dependency-image-report/config.json
                      ${{ runner.temp }}/dependency-image-report/identity.json
                      ${{ runner.temp }}/dependency-image-report/assessment.json
                      ${{ runner.temp }}/dependency-image-report/blocked-assessment.json
                      ${{ runner.temp }}/dependency-image-report/cargo-lock-copy-diagnostics.txt
                      ${{ runner.temp }}/dependency-image-report/controller/source-revision.txt
                      ${{ runner.temp }}/dependency-image-report/controller/cargo-lock.sha256
                      ${{ runner.temp }}/dependency-image-report/controller/cargo.json
                      ${{ runner.temp }}/dependency-image-report/controller/cargo-diagnostics.txt
                      ${{ runner.temp }}/dependency-image-report/controller/rustsec-revision.txt
                      ${{ runner.temp }}/dependency-image-report/controller/rustsec-database.json
                      ${{ runner.temp }}/dependency-image-report/bun-lock.sha256
                      ${{ runner.temp }}/dependency-image-report/bun-audit.json
                      ${{ runner.temp }}/dependency-image-report/bun-audit-diagnostics.txt
                      ${{ runner.temp }}/dependency-image-report/bun-audit-status.txt
                  retention-days: 30
        needs: [changes, build-runtime-images]

    runtime-reliability:
        name: ${{ github.event_name == 'pull_request' && 'short / PR current' || 'short / current' }}
        if: ${{ !cancelled() }}
        needs: [changes, build-runtime-images]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
            RENTNERPROXY_SMOKE_RUN: ${{ needs.build-runtime-images.outputs.scope }}
        steps:
            - name: Require successful selection and selected runtime image producer
              env:
                  SELECTION_RESULT: ${{ needs.changes.result }}
                  RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
                  IMAGE_BUILD_RESULT: ${{ needs.build-runtime-images.result }}
              run: |
                  test "$SELECTION_RESULT" = success
                  case "$RUNTIME_SELECTED" in
                    true) test "$IMAGE_BUILD_RESULT" = success ;;
                    false) echo 'Runtime inputs unchanged; no runtime execution required.' ;;
                    *) exit 1 ;;
                  esac
            - name: Check out exact tested merge commit
              if: needs.changes.outputs.runtime == 'true'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Bun
              if: needs.changes.outputs.runtime == 'true'
              id: bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies
              if: needs.changes.outputs.runtime == 'true'
              run: bun install --frozen-lockfile
            - name: Verify and load same-run runtime images
              if: needs.changes.outputs.runtime == 'true'
              uses: ./.github/actions/load-runtime-images
              with:
                  scope: ${{ needs.build-runtime-images.outputs.scope }}
                  appliance_archive_sha256: ${{ needs.build-runtime-images.outputs.appliance_archive_sha256 }}
                  appliance_identity_sha256: ${{ needs.build-runtime-images.outputs.appliance_identity_sha256 }}
                  http3_archive_sha256: ${{ needs.build-runtime-images.outputs.http3_archive_sha256 }}
                  http3_identity_sha256: ${{ needs.build-runtime-images.outputs.http3_identity_sha256 }}
            - name: Prepare sanitized failure report
              if: needs.changes.outputs.runtime == 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/runtime-reliability-report"
                  printf '%s\n' '{"summary":{"passed":false,"requestedDurationReached":false},"failure":"runner-not-completed"}' > "$RUNNER_TEMP/runtime-reliability-report/report.json"
            - name: Run isolated short runtime reliability fixture
              if: needs.changes.outputs.runtime == 'true'
              run: 'bun --no-env-file --no-orphans scripts/runtime-reliability/run.ts --profile short --image "rentnerproxy-smoke-${RENTNERPROXY_SMOKE_RUN}:appliance" --capture-resources true --report "$RUNNER_TEMP/runtime-reliability-report/report.json"'
            - name: "Remove this run's private Docker resources"
              if: "always() && steps.bun.outcome == 'success'"
              run: bun --no-env-file .github/scripts/ci/production-smoke-ci.ts cleanup
            - name: Store bounded reliability report
              if: "always() && needs.changes.outputs.runtime == 'true'"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pr-runtime-reliability-report-${{ github.run_attempt }}
                  path: '${{ runner.temp }}/runtime-reliability-report/report.json'
                  if-no-files-found: error
                  retention-days: 14

    select-compatibility-sources:
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            sources: ${{ steps.select.outputs.sources }}
            complete: ${{ steps.select.outputs.complete }}
        steps:
            - name: Check out target history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.sha }}
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - id: select
              name: Select immutable source releases
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'all' || '' }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file .github/scripts/ci/release-compatibility/select-sources.ts
        if: needs.changes.outputs.runtime == 'true'

    release-compatibility:
        needs:
            - changes
            - select-compatibility-sources
            - build-runtime-images
        env:
            RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
            RENTNERPROXY_SMOKE_RUN: ${{ needs.build-runtime-images.outputs.scope }}
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                source: ${{ fromJSON(needs.select-compatibility-sources.outputs.sources) }}
        name: "${{ github.event_name == 'pull_request' && 'PR ' || '' }}${{ matrix.source.role }} to target"
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Check out target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.sha }}
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Load verified runtime images
              uses: ./.github/actions/load-runtime-images
              with:
                  scope: ${{ needs.build-runtime-images.outputs.scope }}
                  appliance_archive_sha256: ${{ needs.build-runtime-images.outputs.appliance_archive_sha256 }}
                  appliance_identity_sha256: ${{ needs.build-runtime-images.outputs.appliance_identity_sha256 }}
                  http3_archive_sha256: ${{ needs.build-runtime-images.outputs.http3_archive_sha256 }}
                  http3_identity_sha256: ${{ needs.build-runtime-images.outputs.http3_identity_sha256 }}
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run published-image upgrade compatibility
              env:
                  COMPATIBILITY_SOURCE: ${{ toJSON(matrix.source) }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file --no-orphans .github/scripts/ci/release-compatibility/run.ts
        if: needs.changes.outputs.runtime == 'true'

    compatibility-verified:
        name: ${{ github.event_name == 'pull_request' && 'PR Compatibility verified' || 'Compatibility verified' }}
        if: ${{ !cancelled() }}
        needs:
            - changes
            - select-compatibility-sources
            - build-runtime-images
            - release-compatibility
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Require complete successful compatibility matrix
              env:
                  CHANGE_SELECTION_RESULT: ${{ needs.changes.result }}
                  RUNTIME_SELECTED: ${{ needs.changes.outputs.runtime }}
                  SELECTION_RESULT: ${{ needs.select-compatibility-sources.result }}
                  BUILD_RESULT: ${{ needs.build-runtime-images.result }}
                  MATRIX_RESULT: ${{ needs.release-compatibility.result }}
                  COMPLETE: ${{ needs.select-compatibility-sources.outputs.complete }}
              run: |
                  test "$CHANGE_SELECTION_RESULT" = success
                  case "$RUNTIME_SELECTED" in
                    true) test "$SELECTION_RESULT" = success && test "$BUILD_RESULT" = success && test "$MATRIX_RESULT" = success && test "$COMPLETE" = true ;;
                    false) echo 'Runtime inputs unchanged; no compatibility execution required.' ;;
                    *) exit 1 ;;
                  esac

    full-runtime-verification:
        name: Full runtime verification
        needs:
            [
                changes,
                build-runtime-images,
                production-smokes,
                production-candidate,
                runtime-reliability,
                select-compatibility-sources,
                release-compatibility,
                compatibility-verified,
            ]
        if: ${{ !cancelled() && needs.changes.outputs.runtime == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Require real successful runtime and complete upgrade verification
              env:
                  RESULTS: ${{ join(needs.*.result, ',') }}
                  COMPLETE: ${{ needs.select-compatibility-sources.outputs.complete }}
              run: |
                  test "$COMPLETE" = true
                  test "$RESULTS" = success,success,success,success,success,success,success,success
