[package]
name = "rentnerproxy-monitoring-b2-experiment"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"

[workspace]
